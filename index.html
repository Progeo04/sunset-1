<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador 3D</title>

  <script
    type="module"
    src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100vh;
      display: block;
      background-color: #fffcfc;
    }
  </style>
</head>
<body>

<model-viewer
  id="visualizador"
  src="modelo.glb"
  camera-controls
  shadow-intensity="1"
  environment-image="neutral"
  exposure="1">
</model-viewer>

<script>
console.log("versão 1.0");
const viewer = document.querySelector("#visualizador");

viewer.addEventListener("load", () => {
  const materiais = viewer.model?.materials;

  if (!materiais) return;

  materiais.forEach((material) => {
    console.log("modelo carregado");
    const pbr = material.pbrMetallicRoughness;

    if (!pbr) return;

    pbr.setBaseColorFactor([0.35, 0.35, 0.35, 1]);
    pbr.setMetallicFactor(0);
    pbr.setRoughnessFactor(1);
  });
});
</script>

</body>
</html>
