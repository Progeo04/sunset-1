<!doctype html>
<html>
<head>
  <meta charset="utf-8">

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #000000;
    }
  </style>
</head>

<body>

<model-viewer
  src="modelo.glb"
  camera-controls
  shadow-intensity="2"
  exposure="0.8"
  environment-image="neutral"
  auto-rotate
  disable-pan>
</model-viewer>

</body>
</html>
