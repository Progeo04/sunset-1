<!doctype html>
<html>
<head>
<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body{
margin:0;
}

model-viewer{
width:100vw;
height:100vh;
background:#202020;
}
</style>
</head>

<body>

<model-viewer
src="modelo.glb"
camera-controls
shadow-intensity="2"
environment-image="neutral"
exposure="0.8">
</model-viewer>

<script>
document.querySelector("model-viewer").addEventListener("load", async () => {
  const viewer = document.querySelector("model-viewer");

  const material = viewer.model.materials[0];

  material.pbrMetallicRoughness.setBaseColorFactor([
    0.55,0.35,0.15,1
  ]);
});
</script>

</body>
</html>

</body>
</html>
