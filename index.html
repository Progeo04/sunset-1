<!doctype html>
<html>
<head>
<script type="module"
src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

<style>
body{
margin:0;
}

model-viewer{
width:100vw;
height:100vh;
background:#1f1f1f;
}
</style>
</head>

<body>

<model-viewer
src="modelo.glb"
camera-controls
shadow-intensity="1.5"
environment-image="neutral"
exposure="1">
</model-viewer>

<script>
document.querySelector("model-viewer").addEventListener("load", async () => {
  const viewer = document.querySelector("model-viewer");

  viewer.model.materials.forEach((material) => {
    material.pbrMetallicRoughness.setBaseColorFactor([
      0.65,0.55,0.35,1
    ]);
  });
});
</script>

</body>
</html>

</body>
</html>
