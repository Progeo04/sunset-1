<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Visualizador 3D</title>
  <script type="module" src="https://googleapis.com"></script>

  <style>
    body { margin: 0; }
    model-viewer {
      width: 100vw;
      height: 100vh;
      background-color: #fffcfc; /* Fundo quase branco */
    }
  </style>
</head>

<body>

<model-viewer 
  id="viewer"
  src="modelo.glb" 
  alt="Um modelo 3D configurado dinamicamente"
  camera-controls 
  shadow-intensity="1" 
  environment-image="neutral" 
  exposure="1">
</model-viewer>

<script>
  const viewer = document.querySelector("#viewer");

  viewer.addEventListener("load", () => {
    const materials = viewer.model.materials;

    materials.forEach((material) => {
      // Cria uma referência curta para o PBR
      const pbr = material.pbrMetallicRoughness;

      // Cor: Cinza Escuro (0.2 ≈ 51 em escala 0-255)
      pbr.setBaseColorFactor([0.2, 0.2, 0.2, 1]);

      // Acabamento: Totalmente Fosco (Dielectric)
      pbr.setMetallicFactor(0);   // 0 = plástico/borracha, 1 = metal
      pbr.setRoughnessFactor(1);  // 1 = rugoso/difuso, 0 = espelhado
    });
    
    console.log("Materiais atualizados com sucesso.");
  });
</script>

</body>
</html>
